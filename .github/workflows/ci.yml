name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The fleet's CI shape (go-ndarray/ndarray): a 100% statement-coverage gate
# with -race on three operating systems, native amd64/arm64 execution, the
# other 64-bit architectures and 32-bit arm under qemu (386 natively), every
# GOOS/GOARCH pair compiling the tests, and govulncheck.
#
# The SciPy/mpmath fixtures (testdata/*.json, from testdata/gen/fixtures.py)
# run in every execution lane, on architectures where Go fuses multiply-adds
# (arm64, ppc64le, s390x, riscv64, loong64) and where it does not (amd64,
# 386, arm). The comparisons are written to hold on both: evaluation counts
# are compared exactly only where the path does not hinge on the last bit,
# and the coverage gate is reached on amd64 and arm64 alike.
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
      - run: go version
      - run: go vet ./...
      - run: go build ./...
      - name: Test + 100% coverage gate
        shell: bash
        run: |
          COVERPKG=$(go list ./... | paste -sd, -)
          go test -race -coverpkg="$COVERPKG" -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -n 40
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }

  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
      - run: go env GOARCH
      - name: Vet + build + run (accuracy fixtures included)
        run: |
          go vet ./...
          go build ./...
          go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
          # 32-bit: int is 32 bits.
          - { goarch: arm,     qemu: qemu-arm-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Vet + test under qemu (${{ matrix.goarch }})
        run: |
          GOOS=linux GOARCH=${{ matrix.goarch }} go vet ./...
          GOARCH=${{ matrix.goarch }} go test -timeout 30m -exec=${{ matrix.qemu }} ./...

  # 386 runs natively on the amd64 runner (the kernel executes 32-bit x86
  # binaries), not under qemu-i386, whose emulation loses x87/SSE state across
  # preemption.
  arch-386:
    name: arch 386
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
      - name: Vet + test (GOARCH=386)
        run: |
          GOARCH=386 go vet ./...
          GOARCH=386 go test ./...

  # Every GOOS/GOARCH pair Go supports must at least compile the library's
  # tests: a test that does not compile on a target is a test that never
  # runs there, and nothing else would notice.
  cross-compile:
    name: compile tests on every target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
      - name: go test -c (go vet on android/ios) for each go tool dist list pair
        run: |
          fail=0
          for t in $(go tool dist list); do
            os=${t%/*}; arch=${t#*/}
            # android/ios refuse to build without a cgo linker, even for vet;
            # with cgo nominally on and CC=false, vet type-checks the package
            # and its tests (there is no import "C" to compile).
            case $os in android|ios) mode="vet" ;; *) mode="test" ;; esac
            for p in $(go list ./...); do
              if [ $mode = test ]; then
                out=$(CGO_ENABLED=0 GOOS=$os GOARCH=$arch go test -c -o /dev/null "$p" 2>&1) || { echo "::error::$t $p: $out"; fail=1; }
              else
                out=$(CGO_ENABLED=1 CC=false GOOS=$os GOARCH=$arch go vet "$p" 2>&1) || { echo "::error::$t $p: $out"; fail=1; }
              fi
            done
          done
          exit $fail

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
